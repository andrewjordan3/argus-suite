# pyproject.toml

[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

###############################################################################
# [project] - CORE PACKAGE METADATA
###############################################################################
[project]
name = "argus-suite"
version = "0.1.0"
description = "Analytics & Risk Governance Utility Suite - Forensic analysis toolkit for fuel card fraud detection"
readme = "README.md"
authors = [{ name = "Andrew Jordan", email = "andrewjordan3@gmail.com" }]
maintainers = [{ name = "Andrew Jordan", email = "andrewjordan3@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "analytics",
    "forensics",
    "fraud-detection",
    "risk-management",
    "statistical-analysis",
    "fuel-card",
    "data-science",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]

# Core runtime dependencies
dependencies = [
    "pandas>=2.3.0",
    "numpy>=2.3.0",
    "scipy>=1.16.0",
    "matplotlib>=3.10.0",
    "ruptures>=1.1.10",
    "statsmodels>=0.14",
    "pyyaml>=6.0.0",
    "pydantic>=2.11.0",
]

# Python version requirements
requires-python = ">=3.12"

# Optional dependency groups
[project.optional-dependencies]
# Development dependencies
dev = [
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "types-pyyaml>=6.0.0",
    "pandas_stubs>=2.3.0",
    "scipy-stubs>=1.15.0",
]

# Project URLs
[project.urls]
Homepage = "https://github.com/andrewjordan3/argus-suite"
Repository = "https://github.com/andrewjordan3/argus-suite"

###############################################################################
# [tool.setuptools] - PACKAGE DISCOVERY
###############################################################################
[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools]
zip-safe = false

[tool.setuptools.package-data]
argus = ["locales/*.yaml", "defaults/*.yaml"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["argus*"]
exclude = ["tests*", "docs*"]

###############################################################################
# [tool.ruff] - LINTING AND FORMATTING
###############################################################################
[tool.ruff]
line-length = 88
target-version = "py312"

exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
    "*.egg-info",
    "examples",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "T10", # flake8-debugger
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib
    "PL",  # pylint
    "RUF", # ruff-specific rules
    "PGH", # pygrep-hooks (requires error code for type ignores)
    "G",   # flake8-logging-format (Enforces lazy logging %s over f-strings)
    "N",   # pep8-naming
    "PT",  # flake8-pytest-style (Test suite consistency)
]

ignore = [
    "E501", # Line too long (handled by ruff format)
    "E203", # Whitespace before ':' (conflicts with formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["argus"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

###############################################################################
# [tool.mypy] - STATIC TYPE CHECKING
###############################################################################
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

exclude = ["examples/", "tests/"]

# Ignore missing imports for third-party libraries without stubs
[[tool.mypy.overrides]]
module = ["scipy.*", "matplotlib.*"]
ignore_missing_imports = true

###############################################################################
# PYRIGHT - FOR VS CODE PYLANCE
###############################################################################
[tool.pyright]
include = ["src"]
exclude = ["**/node_modules", "**/__pycache__", "**/.*"]
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false

###############################################################################
# PYTEST - TESTING
###############################################################################
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--cov=argus",
    "--cov-report=term-missing",
    "--cov-report=html",
]

###############################################################################
# COVERAGE
###############################################################################
[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/__pycache__/*", "*/site-packages/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
