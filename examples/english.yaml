# -----------------------------------------------------------------------------
# ANALYSIS SCOPE SECTION
# -----------------------------------------------------------------------------
analysis_scope:
  section_title: "DATA ANALYSIS SCOPE"
  final_scope_title: "FINAL ANALYSIS SCOPE"

  labels:
    branches: "Branches"
    date_range: "Date Range"
    total_transactions: "Total Transactions"

  format: "  • {label}: {value}"

  scenarios:
    split:
      description: |
        • Data spans multiple years ({min_year}-{current_year}) with sufficient current-year data ({num_months_current_year} months).
        • Main (Aggregate) Analysis will be FOCUSED on the current year ({current_year}) to highlight recent patterns.
        • Temporal Analysis will use the FULL date range to establish a historical baseline and detect changes over time.
        • RATIONALE: This split prevents older, 'normal' data from diluting or masking emerging issues in the aggregate report,
          while leveraging the full history to provide context for the temporal trend analysis.

    insufficient:
      description: |
        • Data spans multiple years, but current year has insufficient data ({num_months_current_year} months).
        • Main and Temporal analysis will use the full date range.
        • RATIONALE: Without enough data in the current year, splitting is not statistically sound. A unified analysis period is used.

    single:
      description: |
        • Data is within a single year or has insufficient history for a meaningful split.
        • Main and Temporal analysis will use the same unified dataset.
        • RATIONALE: No split is necessary as the data does not cross multiple years.

# -----------------------------------------------------------------------------
# STATISTICAL METHODOLOGY SECTION
# -----------------------------------------------------------------------------
statistical_methodology:
  section_title: "STATISTICAL METHODOLOGY & INTERPRETATION GUIDE"

  introduction: |
    This analysis employs established statistical techniques to ensure defensible conclusions:

  effect_sizes:
    section_header: "EFFECT SIZE MEASURES"

    risk_ratio:
      label: "Risk Ratio (RR)"
      description: "How many times more likely the event is to happen in {target_location} vs other branches."
      interpretation:
        - "RR = 1.0: No difference"
        - "RR > {risk_ratio_substantial}: Substantial difference"
        - "RR > {risk_ratio_major}: Major concern"

    odds_ratio:
      label: "Odds Ratio (OR)"
      description: "Strength of the association between the location and the event."
      interpretation:
        - "OR = 1.0: No association"
        - "OR > {odds_ratio_strong}: Strong association"
        - "OR > {odds_ratio_very_strong}: Very strong"

    risk_difference:
      label: "Risk Difference (RD)"
      description: "The absolute difference in event rates (proportions) between groups, showing the size of the gap."
      interpretation:
        - "RD > {risk_diff_practical} ({risk_diff_practical_pct}): Practically significant"
        - "RD > {risk_diff_major} ({risk_diff_major_pct}): Major difference"

  significance:
    section_header: "STATISTICAL SIGNIFICANCE"

    p_value:
      label: "P-value"
      description: "Probability of observing data at least as extreme as the observed, assuming the null hypothesis is true."
      interpretation:
        - "p < {p_significant}: Statistically significant* ({confidence_pct} confidence)"
        - "p < {p_very_significant}: Highly significant** ({very_significant_confidence_pct} confidence)"
        - "p < {p_highly_significant}: Extremely significant*** ({highly_significant_confidence_pct} confidence)"
      note: "Significance threshold: α = {alpha:.2f} (confidence level = {confidence_level:.2f})."

    confidence_intervals:
      label: "Confidence Intervals (CI)"
      description: "Range of plausible values for the true effect"
      interpretation: "A (1−α) CI excluding 1.0 for ratios (or 0.0 for differences) indicates significance at level α."

  non_parametric:
    section_header: "NON-PARAMETRIC TESTS"

    mann_whitney:
      label: "Mann-Whitney U"
      description: "Compares distributions without assuming normality"

    cliffs_delta:
      label: "Cliff's Delta"
      description: "Effect size for ordinal data (-1 to +1). Larger |δ| indicates stronger stochastic dominance."
      interpretation:
        - "|δ| < {cliffs_delta_negligible}: Negligible"
        - "{cliffs_delta_negligible}-{cliffs_delta_small}: Small"
        - "{cliffs_delta_small}-{cliffs_delta_medium}: Medium"
        - "> {cliffs_delta_medium}: Large"

    cohens_d:
      label: "Cohen's d"
      description: "Standardized mean difference between groups."
      interpretation:
        - "|d| < {cohens_d_negligible}: Negligible"
        - "{cohens_d_negligible}-{cohens_d_small}: Small"
        - "{cohens_d_small}-{cohens_d_medium}: Medium"
        - "> {cohens_d_medium}: Large"

  independence:
    section_header: "INDEPENDENCE TESTS"

    chi_square:
      label: "Chi-square test"
      description: "Tests association between categorical variables"

    fishers_exact:
      label: "Fisher's exact test"
      description: "More accurate for small samples"

    cramers_v:
      label: "Cramér's V"
      description: "Summarized effect size for chi-square (0 to 1)"

  multiple_testing:
    section_header: "5. MULTIPLE TESTING CORRECTION"
    label: "Benjamini-Hochberg False Discovery Rate (FDR)"
    description: "Controls the expected proportion of false discoveries at level α when testing multiple hypotheses."
    procedure: "This procedure generates q‑values (BH‑adjusted p‑values) and deems a result significant if q < α (= {alpha:.2f})."

  assumptions: |
    Assumptions include appropriate data quality, sampling, and independence where required.
    Departures (e.g., confounding, dependence) can affect validity.

# -----------------------------------------------------------------------------
# MULTIPLE TESTING CORRECTION SECTION
# -----------------------------------------------------------------------------
multiple_testing_correction:
  section_title: "MULTIPLE TESTING CORRECTION (Benjamini-Hochberg FDR)"

  introduction: |
    Applying FDR correction to control the expected proportion of false discoveries across multiple tests...

    Raw p-values and BH-adjusted p-values (q-values) are reported. A test is significant if its q-value is less than {alpha:.2f}.
    This ensures that significance claims remain valid even when testing multiple hypotheses.

  table_headers:
    test_name: "Test Name"
    raw_p_value: "Raw p-value"
    q_value: "q-value (FDR)"
    significant: "Significant?"

  markers:
    significant: "✓ YES"
    not_significant: "✗ NO"

# -----------------------------------------------------------------------------
# TEST RESULT INTERPRETATIONS
# -----------------------------------------------------------------------------
test_interpretations:
  cost_distribution:
    significant:
      title: "✓ EXECUTIVE FINDING: STATISTICALLY SIGNIFICANT after FDR correction"
      direction: "→ {target_location} transaction costs are {direction} than other branches."
      difference: "→ Mean difference: {mean_difference} per transaction"

    not_significant:
      title: "✗ EXECUTIVE FINDING: NOT statistically significant after FDR correction"
      message: |
        → While there may be numerical differences in transaction costs, they do not
          meet the threshold for statistical reliability after accounting for multiple comparisons.

  rate_comparison:
    significant:
      title: "✓ EXECUTIVE FINDING: STATISTICALLY SIGNIFICANT after FDR correction"
      interpretation: "→ Interpretation: {target_location} is {risk_ratio:.1f} times more likely"
      context: "  to have {test_name}. This result is unlikely under the null hypothesis (post-FDR)."

    not_significant:
      title: "✗ EXECUTIVE FINDING: NOT statistically significant after FDR correction"
      message: |
        → While there may be a numerical difference, it does not meet the threshold
          for statistical reliability after accounting for multiple comparisons.

  cliffs_delta:
    format: "({magnitude} effect, {target_location} costs are {direction})"

  cohens_d:
    format: "({magnitude} effect, {target_location} costs are {direction})"

  p_value:
    highly_significant: "highly significant (p < {p_highly_significant})"
    very_significant: "very significant (p = {clean_p_value:.3f})"
    significant: "significant (p = {clean_p_value:.3f})"
    not_significant: "not significant (p = {clean_p_value:.3f})"

