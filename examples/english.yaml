# -----------------------------------------------------------------------------
# TEMPORAL ANALYSIS SECTION
# -----------------------------------------------------------------------------
temporal_analysis:
  section_title: "ADVANCED TEMPORAL ANALYSIS — FRAUD EMERGENCE & PATTERN DETECTION"

  introduction:
    paragraphs:
      - "This analysis identifies when suspicious patterns emerged in {target_location} and tracks"
      - "their evolution over time. Unlike aggregate statistics, this examines individual drivers"
      - "and vehicles month-by-month to detect behavior changes, sudden spikes, gradual escalation,"
      - "and specific fraud signatures that may indicate misuse inception or systematic exploitation."
      - ""
      - "The temporal risk score (0-100) is calculated from EIGHT weighted components:"
      - "  • Concerning trends (20 pts) - Monotonic increases in suspicious metrics"
      - "  • Change points (25 pts) - Significant behavioral shifts"
      - "  • Sudden spikes (25 pts) - Month-over-month jumps >{spike_threshold_pct}%"
      - "  • Gradual escalation (15 pts) - Consecutive months of increases"
      - "  • Fraud patterns (30 pts) - Specific known fraud signatures [HIGHEST WEIGHT]"
      - "  • Autocorrelation (15 pts) - Persistent/systematic bad behavior"
      - "  • Anomalies (15 pts) - Outlier months from rolling baseline"
      - "  • Current state (20 pts) - Risk factors in most recent month [CRITICAL]"

  metric_display_names:
    datetime_count: "Transaction Count"
    transaction_volume: "Transaction Count"
    no_eld_rate: "No ELD Rate"
    non_diesel_rate: "Non-Diesel Rate"
    after_hours_rate: "After-Hours Rate"
    avg_transaction_cost: "Avg Transaction Cost"

  metric_definitions:
    section_title: "METRIC DEFINITIONS:"

    metrics:
      transaction_volume:
        label: "Transaction Count"
        definition: "Number of unique fuel purchases per month"
        note: "(Counts unique timestamps - diesel+DEF on same receipt = 1 transaction)"

      no_eld_rate:
        label: "No ELD Rate"
        definition: "Percentage of transactions WITHOUT matching vehicle telemetry"
        risk: "Higher = worse (less verification available)"

      non_diesel_rate:
        label: "Non-Diesel Rate"
        definition: "Percentage of purchases that are NOT diesel/DEF"
        risk: "Higher = worse (unusual products for commercial fleet)"

      after_hours_rate:
        label: "After Hours Rate"
        definition: "Percentage of transactions OUTSIDE business hours ({business_hours_range})"
        risk: "Higher = worse (unusual timing for business operations)"

      avg_transaction_cost:
        label: "Avg Transaction Cost"
        definition: "Mean dollar amount per transaction each month"
        risk: "Lower = suspicious (suggests passenger vehicle fills vs commercial)"

    analysis_types:
      title: "ANALYSIS METHODS:"

      trend_detection:
        label: "Trend Detection (Mann-Kendall)"
        description: "Tests for monotonic increase/decrease over entire period"
        note: "⚠ Assumes independent observations - autocorrelation may inflate significance"

      change_points:
        label: "Change Point Detection"
        description: "Identifies specific months when behavior significantly shifted"
        methods: "Uses both CUSUM (first change) and Bayesian (all changes)"

      month_over_month:
        label: "Month-over-Month Analysis"
        description: "Compares consecutive months to detect sudden spikes and gradual escalation"
        thresholds:
          - "Sudden Spike: >{spike_threshold_pct}% increase from prior month or >{spike_percentile}th percentile vs baseline"
          - "Gradual Escalation: {consecutive_months}+ consecutive months of increases"
          - "Volatility Score: Standard deviation of monthly percent changes"

      rolling_windows:
        label: "Rolling Window Anomalies (3-month)"
        description: "Identifies months that deviate >2σ from recent baseline"
        note: "Smooths noise while remaining responsive to changes"

      autocorrelation:
        label: "Autocorrelation Analysis"
        description: "Detects if suspicious behavior is persistent vs. random"
        interpretation: "High lag-1 correlation (>{autocorrelation_threshold}) indicates systematic pattern"

      fraud_patterns:
        label: "Fraud Pattern Recognition"
        description: "Matches against known fraud signatures"
        patterns:
          off_hours_concentration: "Excessive non-business hour activity (>{off_hours_threshold_pct}% of transactions)"
          spike_retreat: "Rapid escalation followed by sudden cessation (>{spike_threshold_pct}% spike, then >{retreat_drop_pct}% drop)"
          gradual_escalation: "Sustained increase over extended period (second half >{period_change_pct}% higher than first)"
          operational_anomaly: "Behavior inconsistent with expected business patterns"

    period_comparison:
      title: "Period Comparison (First Half vs Second Half):"
      items:
        - "• INCREASED: Statistically significant rise (p < {p_significant})"
        - "• DECREASED: Statistically significant decline (p < {p_significant})"
        - "• NO CHANGE: No significant difference detected"
        - "• Effect size (r): -1 to +1, larger absolute value = stronger change"

  insufficient_data:
    warning: "⚠ WARNING: Insufficient data for entity-level temporal analysis."
    details: "Entities need at least {min_transactions_temporal} transactions across {min_months_temporal}+ months."
    recommendation: "Consider lowering thresholds or extending analysis period for more coverage."

  summary_statistics:
    title: "TEMPORAL SUMMARY STATISTICS:"
    items:
      - "• Analysis Period: {date_min} to {date_max}"
      - "• Entities analyzed (drivers + vehicles): {total_entities}"
      - "• Critical Risk (score ≥ {risk_critical}): {critical_count} ({critical_pct})"
      - "• High Risk (score {risk_high}-{risk_critical_minus_one}): {high_risk_count} ({high_risk_pct})"
      - "• Entities with change points: {with_change_points} ({with_change_points_pct})"
      - "• Entities with concerning trends: {with_trends} ({with_trends_pct})"
      - "• Entities with fraud patterns: {with_fraud_patterns} ({with_fraud_patterns_pct})"
      - "• Entities with current active risks: {with_current_risks} ({with_current_risks_pct})"

  top_entities:
    title: "TOP {top_n} HIGHEST RISK ENTITIES"
    introduction: "These entities show the most concerning temporal patterns. Prioritize investigation"
    priority_note: "of those with CURRENT RISKS (active in most recent month) over historical issues."

    entity_header: "═══════════════════════════════════════════════════════════════════"
    entity_title: "{entity_type}: {display_id}"
    truck_entity_title: "{entity_type}: {display_id} ({truck_description})"
    risk_line: "  Risk Score: {risk_score}/100 [{risk_category}]"
    activity_line: "  Active: {months_active} months | Transactions: {total_transactions}"
    flags_line: "  Analysis Flags: {flags}"

    current_risks:
      title: "  🚨 CURRENT RISK FACTORS (Most Recent Month):"
      format: "    • {factor}"
      none: "  ✓ No elevated risk factors in most recent month"

    fraud_patterns:
      title: "  ⚠ FRAUD PATTERN SIGNATURES DETECTED:"
      patterns:
        off_hours_concentration: "    • OFF-HOURS CONCENTRATION: Excessive non-business hour activity"
        spike_retreat: "    • SPIKE-AND-RETREAT: Rapid escalation followed by sudden cessation"
        gradual_escalation: "    • GRADUAL ESCALATION: Sustained increase over extended period"
        operational_anomaly: "    • OPERATIONAL ANOMALY: Behavior inconsistent with business patterns"
      none: "(No specific fraud patterns detected)"

    month_over_month:
      title: "  📊 MONTH-OVER-MONTH ANALYSIS:"

      sudden_spikes:
        label: "    Sudden Spikes Detected:"
        format: "      • {metric}: Max {percentile:.1f}th percentile across {count} months ({months})"
        none: "      (None)"

      gradual_escalation:
        label: "    Gradual Escalation:"
        format: "      • {metric}: {consecutive} consecutive months of increases"
        none: "      (None)"

      volatility:
        label: "    Volatility Score: {volatility_score}"
        high_note: "      ⚠ High volatility indicates erratic behavior changes"

    change_points:
      title: "  📍 BEHAVIOR CHANGE POINTS:"
      single_format: "    • {metric}: Changed around {month}"
      multiple_intro: "    • {metric}: Multiple changes detected"
      format: "  • {metric}: {date}"
      multiple_format: "  • {metric}: Multiple changes ({dates})"
      none: "  (No significant change points detected)"

    autocorrelation:
      title: "  🔄 PERSISTENT PATTERNS:"
      explanation: "  High autocorrelation indicates behavior is consistently problematic (not random):"
      format: "  • {metric}: Correlation = {correlation} (Persistently {level})"
      high_note: "      ⚠ High autocorrelation indicates systematic/persistent behavior"
      none: "  (No high-persistence patterns detected)"

    rolling_anomalies:
      title: "  🎯 ROLLING WINDOW ANOMALIES:"
      format: "  • {metric}: Outliers in {months} (Max Z-score: {z_score})"
      z_score: "      (Max z-score: {max_z_score})"
      none: "  (No anomalous months detected)"

    trends:
      title: "  📈 BEHAVIORAL TRENDS:"
      format: "    • {indicator}"
      none: "  (No concerning long-term trends detected)"

    period_comparison:
      title: "  ⚖ PERIOD COMPARISON (First Half vs Second Half):"
      format: "  • {metric}: {result}"
      explanation: "  Comparing first half of period to second half:"

    entity_summary:
      title: "📋 SUMMARY:"
      risk_format: "  Risk Level: {risk_category} (Score: {risk_score}/100)"
      flags_format: "  Active Flags: {flags}"
      recommendations:
        critical: "Immediate investigation recommended - Critical risk level"
        high: "Priority review recommended - High risk level"
        moderate: "Routine monitoring recommended - Moderate risk level"
        low: "Standard monitoring sufficient - Low risk level"

  risk_distribution:
    title: "TEMPORAL RISK DISTRIBUTION BY ENTITY TYPE"

    overall:
      title: "Overall Distribution:"
      critical: "  Critical ({risk_critical}-100): {critical_count} entities"
      high: "  High ({risk_high}-{risk_critical_minus_one}): {high_count} entities"
      medium: "  Medium ({risk_medium}-{risk_high_minus_one}): {medium_count} entities"
      low: "  Low (0-{risk_medium_minus_one}): {low_count} entities"

    drivers:
      title: "Drivers (n={count}):"
      items:
        - "  Mean Risk Score: {mean_risk:.1f}"
        - "  Median Risk Score: {median_risk:.1f}"
        - "  Critical Risk (≥{risk_critical}): {critical_count} ({critical_pct:.1f}%)"
        - "  High Risk ({risk_high}-{risk_critical_minus_one}): {high_risk_count} ({high_risk_pct:.1f}%)"
      none: "  No driver entities met minimum threshold for analysis"

    vehicles:
      title: "Vehicles (n={count}):"
      items:
        - "  Mean Risk Score: {mean_risk:.1f}"
        - "  Median Risk Score: {median_risk:.1f}"
        - "  Critical Risk (≥{risk_critical}): {critical_count} ({critical_pct:.1f}%)"
        - "  High Risk ({risk_high}-{risk_critical_minus_one}): {high_risk_count} ({high_risk_pct:.1f}%)"
      none: "  No vehicle entities met minimum threshold for analysis"

  fraud_timeline:
    title: "FRAUD EMERGENCE TIMELINE"
    subtitle: "When did suspicious behavior changes occur?"

    frequency_intro:
      title: "Change Point Frequency by Month:"
      subtitle: "(Number of entities showing significant behavior changes)"

    month_format: "  {month}: {count} {label}"

    peak_insight:
      marker: "⚠ EXECUTIVE INSIGHT:"

      peak_single:
        paragraphs:
          - "  Peak change activity occurred in {peak_month} ({peak_count} entities)."
          - "  This suggests potential systemic issues or coordinated fraud may have"
          - "  begun or intensified around this time. Recommend investigating:"
          - "    • New employees or contractors hired near this date"
          - "    • Policy/supervision changes implemented around this period"
          - "    • Common attributes among entities with changes in this month"

      peak_multiple:
        paragraphs:
          - "  Multiple peaks detected: {peak_months}"
          - "  This pattern may indicate:"
          - "    • Multiple waves of fraud activity"
          - "    • Different groups testing/exploiting at different times"
          - "    • Response to detection attempts (stopping then resuming)"

    patterns:
      title: "  Temporal Pattern Insights:"
      early_changes: "    • Early changes ({early_pct}% in first third): Possible long-term misuse"
      late_changes: "    • Late changes ({late_pct}% in last third): Recent/emerging issues"
      clustered: "    • Clustered changes: Suggests coordinated or learned behavior"
      distributed: "    • Distributed changes: Suggests opportunistic individual actions"

    no_changes:
      paragraphs:
        - "✓ No significant change points detected across entities."
        - "  Behavior patterns appear relatively stable over the analysis period."
        - "  (This does not rule out consistent misuse - only changing misuse patterns)"

  fraud_pattern_summary:
    title: "FRAUD PATTERN DETECTION SUMMARY"
    intro: "Entities matching specific fraud signatures:"

    off_hours_concentration:
      title: "  Off-Hours Concentration Pattern:"
      description: "    Excessive non-business hour activity (>{off_hours_threshold_pct}% of transactions)"
      count: "    Detected in: {count} entities"
      concern: "    Concern: Personal use or unauthorized activity during weekends/evenings"

    spike_retreat:
      title: "  Spike-and-Retreat Pattern:"
      description: "    Rapid escalation followed by sudden cessation (>{spike_threshold_pct}% spike, then >{retreat_drop_pct}% drop)"
      count: "    Detected in: {count} entities"
      concern: "    Concern: Testing detection thresholds, then backing off to avoid scrutiny"

    gradual_escalation:
      title: "  Gradual Escalation Pattern:"
      description: "    Sustained increase over extended period (second half >{period_change_pct}% higher than first)"
      count: "    Detected in: {count} entities"
      concern: "    Concern: Incremental misuse increase to avoid triggering sudden anomaly alerts"

    operational_anomaly:
      title: "  Operational Anomaly Pattern:"
      description: "    Behavior inconsistent with normal business operational patterns"
      count: "    Detected in: {count} entities"
      concern: "    Concern: Activity inconsistent with expected seasonal/operational variations"

    none_detected:
      message: "  ✓ No specific fraud patterns detected in analyzed entities."

  comparative_analysis:
    title: "COMPARATIVE TEMPORAL ANALYSIS"
    introduction: "Comparing temporal risk patterns: {target_location} vs Other Branches"

    comparison_title: "Temporal Risk Score Comparison:"
    target_line: "  {target_location}:"
    target_stats: "    Mean = {target_mean:.2f}, Median = {target_median:.2f}"
    others_line: "  Other Branches:"
    others_stats: "    Mean = {others_mean:.2f}, Median = {others_median:.2f}"

    test_line: "  Statistical Test: Mann-Whitney U, p = {p_value:.4f}"
    iqr_format: "  25th-75th percentile: {p25} - {p75}"
    sample_size_format: "  Sample size: {n} entities"
    effect_size_line: "  Effect Size (Cliff's Delta): δ = {delta} ({interpretation})"

    interpretations:
      significant_higher:
        paragraphs:
          - ""
          - "  ⚠ STATISTICALLY SIGNIFICANT DIFFERENCE (p < {p_significant})"
          - "  {target_location} demonstrates higher temporal risk scores than other branches."
          - "  This pattern indicates more frequent or severe behavior changes at this location."
          - ""
          - "  Implications for Consideration:"
          - "    • Enhanced scrutiny of {target_location} entities may be warranted"
          - "    • Differences in management practices or controls may exist"
          - "    • Local operational factors may be contributing to increased risk"
          - "    • Further investigation into branch-specific patterns is advisable"

      significant_lower:
        paragraphs:
          - ""
          - "  ✓ STATISTICALLY SIGNIFICANT DIFFERENCE (p < {p_significant})"
          - "  {target_location} demonstrates lower temporal risk scores than other branches."
          - "  This suggests more stable behavioral patterns at this location."
          - "  While overall risk is lower, individual high-risk entities still warrant attention."

      not_significant:
        paragraphs:
          - ""
          - "  NO STATISTICALLY SIGNIFICANT DIFFERENCE (p ≥ {p_significant})"
          - "  {target_location} temporal risk is statistically comparable to other branches."
          - "  Investigation focus should be directed toward individual high-risk entities"
          - "  rather than branch-wide systemic issues."

    effect_size_guide:
      title: "  Effect Size Analysis (Cliff's Delta):"
      negligible: "Negligible (|δ| < {cliffs_delta_negligible}) - Minimal practical difference between locations"
      small: "Small (|δ| < {cliffs_delta_small}) - Detectable but modest difference"
      medium: "Medium (|δ| < {cliffs_delta_medium}) - Moderate practical difference"
      large: "Large (|δ| ≥ {cliffs_delta_medium}) - Substantial practical difference"
      probability_explanation:
        - "    Interpretation: If you randomly select one entity from {target_location}"
        - "    and one from other branches, there's a {probability} chance the"
        - "    {comparison_entity} entity has a higher risk score."
      identical: "    Interpretation: The distributions are essentially identical."

      interpretation_note: |

        Note: Statistical significance (p-value) indicates whether a difference exists.
        Effect size (Cliff's Delta) indicates whether that difference is practically meaningful.
        Both should be considered when evaluating findings.

  interpretation_guide:
    title: "INTERPRETATION GUIDE"

    high_confidence:
      title: "Highest Confidence Fraud Indicators (Investigate First):"
      items:
        - "  ✓ CURRENT RISKS present (active in most recent month)"
        - "  ✓ Multiple fraud patterns detected (2+ signatures)"
        - "  ✓ Both trends AND change points detected (converging evidence)"
        - "  ✓ High autocorrelation (persistent/systematic behavior)"
        - "  ✓ Risk score ≥{risk_critical} (Critical category)"

    medium_confidence:
      title: "Medium Confidence (Requires Additional Context):"
      items:
        - "  • Single fraud pattern detected"
        - "  • Change points without trends (could be legitimate business change)"
        - "  • Trends without change points (gradual evolution)"
        - "  • Risk score {risk_high}-{risk_critical_minus_one} (High category)"
        - "  • Historical issues without current risks (may be resolved)"

    lower_priority:
      title: "Lower Priority (Monitor but Don't Rush):"
      items:
        - "  • Risk score {risk_medium}-{risk_high_minus_one} (Medium category)"
        - "  • No fraud patterns, only statistical anomalies"
        - "  • Short analysis period (<{min_months_temporal} months)"
        - "  • Very few transactions (<{min_transactions_risk} total)"

  caveats:
    title: "ANALYSIS CAVEATS & LIMITATIONS"
    items:
      - "• Small sample sizes (few months/transactions) reduce statistical power"
      - "• Autocorrelation violates independence assumptions in some tests"
      - "• Legitimate business changes can trigger false positives"
      - "• Absence of patterns doesn't prove absence of fraud (only changing fraud)"
      - "• Short analysis periods may miss longer-term patterns"
      - "• Some fraud patterns may be location/industry specific"

    recommendation: "Use temporal analysis as ONE piece of evidence alongside aggregate statistics,"
    continuation: "network analysis, and investigator judgment. Converging evidence is strongest."

