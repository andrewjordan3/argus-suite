# -----------------------------------------------------------------------------
# EXECUTIVE SUMMARY SECTION
# -----------------------------------------------------------------------------
executive_summary:
  section_title: "EXECUTIVE SUMMARY OF STATISTICAL FINDINGS"

  introduction: |
    All findings below have passed Benjamini-Hochberg (FDR) correction
    and are considered statistically reliable.

  no_findings:
    title: "NO STATISTICALLY SIGNIFICANT DIFFERENCES DETECTED"
    paragraphs:
      - |
        While numerical differences may exist between {target_location}
        and other branches, none of these differences met the rigorous threshold
        for statistical significance after accounting for multiple comparisons.
      - |
        This suggests that, for the key metrics analyzed, the performance of
        {target_location} is statistically consistent with its peers.
      - |
        However, this does not rule out localized issues or patterns that may
        warrant investigation. Review the detailed analyses below for specific
        drivers, vehicles, or patterns that may require attention.

  findings_present:
    header: "{count} STATISTICALLY SIGNIFICANT FINDING(S) IDENTIFIED:"
