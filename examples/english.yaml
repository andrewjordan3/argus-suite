    cost_comparison:
      main: "→ {test_name} shows a statistically significant difference."
      averages: "   Target avg: {target_avg} vs. Other branches avg: {baseline_avg}"
      effect: "   Effect size (Cliff's Delta): {effect_size:.3f} ({direction} in target location)"

    statistical_strength:
      main: "→ Statistical strength: {p_value}, FDR-adjusted q-value: {q_value:.4f}"
