# =============================================================================
# ARGUS FUEL CARD FORENSICS - ENGLISH LOCALIZATION
# =============================================================================
# Locale: en-US | All user-facing text, templates, and formatting.
# For other languages, create parallel files (e.g., spanish.yaml).
#
# TEMPLATE VARIABLES:
#   - Use {variable_name} syntax for dynamic values
#   - Runtime values use descriptive names (populated from analysis results)
#
# =============================================================================

# -----------------------------------------------------------------------------
# LOCALE SETTINGS - Number, currency, date formatting
# -----------------------------------------------------------------------------
locale:
  language_code: "en-US"
  language_name: "English (US)"

  # Number formatting
  thousands_separator: ","
  decimal_separator: "."
  number_decimals: 0

  # Currency formatting
  currency_symbol: "$"
  currency_position: "before" # "before" ($100) or "after" (100$)
  currency_decimals: 2

  # Percentage formatting
  percentage_decimals: 1
  percentage_symbol: "%"

  # Statistical value formatting
  p_value_decimals: 3
  effect_size_decimals: 3
  confidence_interval_decimals: 2

  # Date/time formatting (Python strftime)
  date_format: "%Y-%m-%d"
  datetime_format: "%Y-%m-%d %H:%M:%S"
  month_format: "%Y-%m"

  # Report layout
  output_width: 100

  # Representation for missing values
  missing_value: "N/A"

# -----------------------------------------------------------------------------
# SYSTEM METADATA - Branding and identification
# -----------------------------------------------------------------------------
metadata:
  system_name: "ARGUS"
  system_full_name: "Analytics & Risk Governance Utility Suite"
  subtitle: "FUEL CARD FORENSICS — EXECUTIVE ANALYSIS SUITE"
  version: "0.1.0"
  report_type: "Fuel Card Forensic Analysis Report"
  classification: "Internal Use - Contains Sensitive Data"

# -----------------------------------------------------------------------------
# TEMPLATE VARIABLE REFERENCE - Developer documentation
# Variables populated at runtime from yaml, config.yaml, or analysis
# -----------------------------------------------------------------------------
_variable_reference:
  # --- Policy-derived variables (from yaml) ---
  # These use {*} naming convention and are injected by the report generator
  policy:
    # Statistical thresholds
    confidence_level: "e.g., 0.95"
    confidence_pct: "e.g., '95%' - formatted for display"
    alpha: "1 - confidence_level"
    p_significant: "p-value threshold for significance (e.g., 0.05)"
    p_very_significant: "p-value threshold for very significant (e.g., 0.01)"
    p_highly_significant: "p-value threshold for highly significant (e.g., 0.001)"
    very_significant_confidence_pct: "e.g., '99%'"
    highly_significant_confidence_pct: "e.g., '99.9%'"

    # Risk thresholds
    risk_critical: "Score threshold for critical risk (e.g., 75)"
    risk_high: "Score threshold for high risk (e.g., 50)"
    risk_medium: "Score threshold for medium risk (e.g., 25)"
